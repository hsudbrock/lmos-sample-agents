name: Publish

on:
  push:
    branches: [ publish ]

env:
  REGISTRY_URL: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  REGISTRY_NAMESPACE: ${{ github.repository_owner }}
  MODULES: "weather-agent news-agent productsearch-agent techspec-agent reportgenerate-agent"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v5
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4.2.1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build with Gradle
        run: ./gradlew build
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker images
        run: |
          modules=(${{ env.MODULES }})
          for module in "${modules[@]}"; do
            version=$(grep '^version=' $module/gradle.properties | awk -F= '{print $2}')
            docker build --build-arg VERSION=$version -f $module/Dockerfile -t ghcr.io/${{ github.repository_owner }}/$module:$version $module
            docker push ghcr.io/${{ github.repository_owner }}/$module:$version
          done
      - name: Publish Chart to GitHub Packages
        run: ./gradlew helmPush
